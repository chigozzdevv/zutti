[package]
name = "zutti-ethereum"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace]
resolver = "3"

[features]
default = []
fulfillment = ["dep:zutti-wallet", "zutti-wallet/native", "dep:zutti-prover", "dep:zutti-protocol", "dep:zutti-source", "dep:pczt"]

spv-fulfillment = ["spv-verification", "zutti-wallet/native"]
spv-verification = ["dep:zutti-wallet", "zutti-wallet/spv-pool", "dep:zutti-protocol", "dep:zutti-source", "dep:pczt", "dep:risc0-zkvm"]

[dependencies]
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"], optional = true }
zutti-wallet = { path = "..", default-features = false, optional = true }
zutti-prover = { path = "../../prover", optional = true }
zutti-protocol = { path = "../../protocol", optional = true }
zutti-source = { path = "../../source", default-features = false, features = ["spv"], optional = true }
pczt = { version = "=0.10.0-pre.0", default-features = false, features = ["signer"], optional = true }
helios-consensus-core = { git = "https://github.com/a16z/helios", rev = "2af9b41887e069144ee56cd710f3ddca195473f8" }
alloy = { version = "=2.1.0", default-features = false, features = ["consensus", "rpc-types", "ssz", "rlp", "k256", "eips"] }
alloy-trie = { version = "=0.9.2", features = ["ethereum"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
clap = { version = "=4.6.1", features = ["derive"] }
thiserror = "=2.0.21"
bincode = "=1.3.3"

[dev-dependencies]
zcash_protocol = "=0.11.0-pre.0"
zcash_primitives = { version = "=0.31.0-pre.0", default-features = false }
zcash_note_encryption = "=0.5.1"
orchard = { version = "=0.16.0", default-features = false }
rand = "=0.10.3"
incrementalmerkletree = "=0.9.0"
zebra-test = "=4.0.0"
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
tempfile = "=3.27.0"
ethereum_ssz = "=0.9.0"
snap = "=1.1.1"
serde_yaml = "=0.9.34"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.3.4", features = ["wasm_js"] }
getrandom4 = { package = "getrandom", version = "=0.4.3", features = ["wasm_js"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
