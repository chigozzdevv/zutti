[package]
name = "zutti-browser-wallet"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace]
resolver = "3"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zutti-wallet = { path = "..", default-features = false, features = ["transaction-proofs"] }
zutti-ethereum = { path = "../ethereum", default-features = false, features = ["spv-verification"] }
zutti-protocol = { path = "../../protocol", features = ["notes"] }
zutti-source = { path = "../../source", default-features = false, features = ["spv"] }
orchard = { version = "=0.16.0", default-features = false, features = ["zeroize"] }
pczt = { version = "=0.10.0-pre.0", default-features = false, features = ["signer", "tx-extractor"] }
zcash_address = "=0.14.0-pre.0"
zcash_protocol = "=0.11.0-pre.0"
zip32 = "=0.3.0"
wasm-bindgen = "=0.2.129"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
bincode = "=1.3.3"
hex = "=0.4.3"
hkdf = "=0.12.4"
sha2 = "=0.10.9"
zeroize = "=1.9.0"
rand = "=0.10.3"
chacha20poly1305 = "=0.10.1"
zcash_note_encryption = "=0.5.1"
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }

[dev-dependencies]
incrementalmerkletree = "=0.9.0"
zcash_primitives = { version = "=0.31.0-pre.0", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
