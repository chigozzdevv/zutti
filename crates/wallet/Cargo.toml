[package]
name = "zutti-wallet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["native"]
native = ["zutti-protocol/entropy", "zutti-protocol/notes", "dep:getrandom", "dep:chacha20poly1305", "dep:tempfile", "dep:libc", "dep:k256", "dep:x25519-dalek", "dep:hkdf", "dep:sha2"]

[dependencies]
zutti-protocol.workspace = true
thiserror.workspace = true
zeroize.workspace = true
getrandom = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
pczt.workspace = true
zcash_primitives.workspace = true
zcash_protocol.workspace = true
orchard.workspace = true
zcash_note_encryption.workspace = true
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa", "std"], optional = true }
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"], optional = true }
hkdf = { version = "=0.12.4", optional = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
pczt = { workspace = true, features = ["signer", "io-finalizer"] }
zcash_protocol = { workspace = true, features = ["local-consensus"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
incrementalmerkletree = "=0.8.2"

[target.'cfg(unix)'.dependencies]
libc = { version = "=0.2.191", optional = true }

[lints]
workspace = true
