[package]
name = "zutti-wallet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autobins = false

[features]
default = ["native"]
native = ["zutti-protocol/entropy", "note-crypto", "pool", "dep:getrandom", "dep:tempfile", "dep:libc", "dep:rand", "dep:zcash_address", "pczt/signer", "pczt/tx-extractor"]
note-crypto = ["zutti-protocol/notes", "dep:chacha20poly1305", "dep:k256", "dep:x25519-dalek", "dep:hkdf", "dep:sha2"]
pool = ["note-crypto", "zutti-protocol/pool", "dep:zutti-source", "zutti-source/authenticated"]
spv = ["dep:zutti-source", "zutti-source/blocks"]
spv-pool = ["pool", "spv"]

[dependencies]
zutti-protocol.workspace = true
zutti-source = { workspace = true, default-features = false, optional = true }
thiserror.workspace = true
zeroize.workspace = true
getrandom = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
rand = { version = "=0.10.3", optional = true }
pczt.workspace = true
zcash_primitives.workspace = true
zcash_protocol.workspace = true
orchard.workspace = true
zcash_note_encryption.workspace = true
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa", "std"], optional = true }
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"], optional = true }
hkdf = { version = "=0.12.4", optional = true }
sha2 = { workspace = true, optional = true }
zcash_address = { version = "=0.14.0-pre.0", optional = true }

[dev-dependencies]
zutti-source = { workspace = true, features = ["blocks"] }
zebra-test = "=4.0.0"
pczt = { workspace = true, features = ["signer", "io-finalizer"] }
zcash_protocol = { workspace = true, features = ["local-consensus"] }
rand = "=0.10.3"
incrementalmerkletree = "=0.9.0"

[target.'cfg(unix)'.dependencies]
libc = { version = "=0.2.191", optional = true }

[lints]
workspace = true
