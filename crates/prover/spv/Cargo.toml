[package]
name = "zutti-spv-prototype"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace]

[features]
default = ["spv", "spv-pool"]
spv = ["zutti-wallet/spv"]
spv-pool = ["spv", "zutti-wallet/spv-pool"]
native = ["zutti-wallet/native"]
wallet = ["native"]
recovery = ["native", "spv-pool"]

[dependencies]
zutti-source = { path = "../../source", default-features = false, features = ["blocks"] }
zutti-protocol = { path = "../../protocol", default-features = false }
zutti-wallet = { path = "../../wallet", default-features = false, features = ["spv-pool"] }
zcash_protocol = "=0.11.0-pre.0"
zcash_primitives = { version = "=0.31.0-pre.0", default-features = false }
zcash_encoding = "=0.5.0"
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std", "client"] }
risc0-build = { version = "=3.0.5", features = ["unstable"] }
risc0-binfmt = "=3.0.5"
clap = { version = "=4.6.1", features = ["derive"] }
sha2 = "=0.10.9"
serde_json = "=1.0.150"
serde = { version = "=1.0.229", features = ["derive"] }
tempfile = "=3.27.0"
hex = "=0.4.3"
zeroize = "=1.9.0"
bincode = "=1.3.3"

[dev-dependencies]
pczt = { version = "=0.10.0-pre.0", default-features = false, features = ["std", "io-finalizer", "zcp-builder", "signer"] }
orchard = { version = "=0.16.0", default-features = false }
rand = "=0.10.3"
incrementalmerkletree = "=0.9.0"
num-bigint = "=0.4.6"
zebra-chain = { version = "=14.0.0", default-features = false }

[[test]]
name = "source-difficulty"
path = "tests/difficulty.rs"

[[bin]]
name = "zutti-wallet"
path = "../../wallet/src/bin/zutti-wallet.rs"
required-features = ["wallet"]

[[test]]
name = "wallet-account"
path = "../../wallet/tests/account.rs"
required-features = ["native"]

[[test]]
name = "spv"
path = "../../source/tests/spv.rs"

[[test]]
name = "source-work"
path = "../../source/tests/work.rs"

[[test]]
name = "payment-binding"
path = "../../wallet/tests/binding.rs"

[[test]]
name = "wallet-preparation"
path = "../../wallet/tests/preparation.rs"

[[test]]
name = "spv-pool"
path = "../../wallet/tests/spv_pool.rs"

[[test]]
name = "spv-coverage"
path = "../../source/tests/coverage.rs"

[[bin]]
name = "zutti-recovery"
path = "../../recovery/src/main.rs"
required-features = ["recovery"]

[[test]]
name = "spv-recovery"
path = "../../recovery/tests/spv.rs"
required-features = ["recovery"]

[[test]]
name = "spv-funding"
path = "../../wallet/tests/funding.rs"
required-features = ["recovery"]
