[package]
name = "zutti-guest"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace]

[[bin]]
name = "history_query"
path = "src/main.rs"

[[bin]]
name = "preparation"
path = "src/preparation.rs"

[dependencies]
zutti-source = { path = "../../../source", default-features = false }
zutti-protocol = { path = "../../../protocol", default-features = false }
zutti-wallet = { path = "../../../wallet", default-features = false }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std", "getrandom"] }

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
