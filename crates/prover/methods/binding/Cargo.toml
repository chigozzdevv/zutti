[package]
name = "zutti-payment-binding-guest"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace]

[[bin]]
name = "payment_binding"
path = "src/main.rs"

[dependencies]
zutti-wallet = { path = "../../../wallet", default-features = false, features = ["spv"] }
zutti-protocol = { path = "../../../protocol", default-features = false }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std", "getrandom"] }

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
dirs = { path = "../source/vendor/dirs" }
