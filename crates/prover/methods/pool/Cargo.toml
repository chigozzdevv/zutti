[package]
name = "zutti-pool-guest"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace]

[[bin]]
name = "pool"
path = "src/main.rs"

[dependencies]
zutti-wallet = { path = "../../../wallet", default-features = false, features = ["pool"] }
zutti-protocol = { path = "../../../protocol", default-features = false, features = ["pool", "notes"] }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std", "getrandom"] }

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
