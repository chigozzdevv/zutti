[package]
name = "zutti-source-guest"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace]

[[bin]]
name = "source"
path = "src/main.rs"

[[bin]]
name = "source_update"
path = "src/update.rs"

[dependencies]
zutti-source = { path = "../../../source", default-features = false, features = ["blocks", "windowed-inputs", "windowed-trees"] }
zutti-protocol = { path = "../../../protocol", default-features = false }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std", "getrandom"] }

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
dirs = { path = "vendor/dirs" }
bls12_381 = { git = "https://github.com/risc0/zkcrypto-bls12_381", rev = "a3192e1bc58921d42d03d99957abf3be55f9d435" }
