[package]
name = "zutti-source-guest"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace]

[features]
boundless = []

[[bin]]
name = "source"
path = "src/main.rs"

[[bin]]
name = "source_update"
path = "src/update.rs"

[[bin]]
name = "spv_source"
path = "src/spv.rs"

[[bin]]
name = "spv_admission"
path = "src/spv_admission.rs"

[dependencies]
zutti-source = { path = "../../../source", default-features = false, features = ["blocks", "windowed-inputs", "accelerated-trees", "accelerated-scripts", "accelerated-sapling-signatures"] }
zutti-protocol = { path = "../../../protocol", default-features = false }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std", "getrandom"] }

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
dirs = { path = "vendor/dirs" }
jubjub = { path = "vendor/jubjub" }
halo2_proofs = { path = "vendor/halo2_proofs" }
maybe-rayon = { path = "vendor/maybe-rayon" }
bls12_381 = { git = "https://github.com/risc0/zkcrypto-bls12_381", rev = "a3192e1bc58921d42d03d99957abf3be55f9d435" }
k256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", rev = "7d4a8d6477e258ce4169ee4669cf92aee0582c39" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", rev = "3ab63a6f1048833f7047d5a50532e4a4cc789384" }
