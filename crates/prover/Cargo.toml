[package]
name = "zutti-prover"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
zutti-protocol.workspace = true
zutti-source = { workspace = true, default-features = false, features = ["blocks", "storage"] }
zutti-methods = { path = "methods" }
zutti-wallet.workspace = true
thiserror.workspace = true
risc0-zkvm = { workspace = true, features = ["client"] }
bincode.workspace = true
zeroize.workspace = true
sha2.workspace = true
mongodb = { version = "=3.9.1", features = ["sync", "redact-errors"] }
clap.workspace = true
serde_json.workspace = true
serde = { version = "=1.0.229", features = ["derive"] }
zcash_protocol.workspace = true
tempfile.workspace = true
hex.workspace = true
base64 = "=0.23.1"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
zcash_script = { workspace = true, features = ["signature-validation"] }
secp256k1 = { version = "=0.33.1", default-features = false, features = ["alloc"] }
sapling = { package = "sapling-crypto", version = "=0.9.0", default-features = false }
risc0-build.workspace = true
risc0-binfmt.workspace = true
zebra-test = "=4.0.0"
zutti-source = { workspace = true, features = ["blocks"] }
pczt = { workspace = true, features = ["signer"] }
zcash_protocol = { workspace = true, features = ["local-consensus"] }
zcash_primitives.workspace = true
orchard.workspace = true
rand = "=0.10.3"
incrementalmerkletree = "=0.9.0"

[lints]
workspace = true
