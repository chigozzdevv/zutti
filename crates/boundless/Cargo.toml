[package]
name = "zutti-boundless"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace]

[dependencies]
alloy = { version = "=1.8.3", default-features = false, features = ["signer-local", "providers", "reqwest"] }
anyhow = "=1.0.102"
boundless-market = { version = "=2.0.1", default-features = false }
clap = { version = "=4.6.1", features = ["derive"] }
dotenvy = "=0.15.7"
hex = "=0.4.3"
libc = "=0.2.186"
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["client", "std"] }
rustix = { version = "=1.1.5", features = ["process"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
tokio = { version = "=1.50.0", features = ["macros", "rt-multi-thread", "time"] }
url = "=2.5.8"
zeroize = "=1.9.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
overflow-checks = true
