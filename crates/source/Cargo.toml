[package]
name = "zutti-source"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["blocks", "cli"]
authenticated = ["dep:im"]
accelerated-proofs = ["blocks", "dep:bellman-legacy", "dep:bls12-381-legacy"]
windowed-inputs = ["accelerated-proofs"]
windowed-trees = ["blocks"]
accelerated-trees = ["windowed-trees", "dep:jubjub-legacy", "dep:group-legacy"]
accelerated-scripts = ["blocks", "dep:k256", "dep:secp256k1"]
accelerated-sapling-signatures = ["blocks", "dep:redjubjub-legacy"]
blocks = ["authenticated", "zutti-protocol/pool", "dep:zcash_primitives", "dep:zcash_protocol", "dep:sha2", "dep:blake2b_simd", "dep:zcash_encoding", "dep:zcash_script", "zcash_script/signature-validation", "dep:transparent", "dep:num-bigint", "dep:zcash_history", "dep:primitive-types", "dep:incrementalmerkletree", "dep:sapling", "dep:orchard", "orchard/circuit", "dep:bellman", "dep:groth16", "dep:bls12_381", "dep:group", "dep:jubjub", "dep:ed25519-zebra", "dep:zebra-chain", "dep:ark-bn254", "dep:ark-ec", "dep:ark-ff"]
storage = ["blocks", "dep:rusqlite", "dep:tempfile"]
cli = ["blocks", "dep:clap", "dep:serde_json", "dep:hex"]

[[bin]]
name = "zutti-source"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "source-replay"
path = "src/bin/source-replay.rs"
required-features = ["cli", "storage"]

[[bin]]
name = "source-inventory"
path = "src/bin/source-inventory.rs"
required-features = ["cli"]

[dependencies]
zutti-protocol.workspace = true
thiserror.workspace = true
zcash_primitives = { workspace = true, optional = true }
zcash_protocol = { workspace = true, optional = true }
sha2 = { workspace = true, features = ["compress"], optional = true }
blake2b_simd = { version = "=1.0.5", optional = true }
zcash_encoding = { workspace = true, optional = true }
zcash_script = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
num-bigint = { version = "=0.4.6", optional = true }
zcash_history = { version = "=0.5.0", optional = true }
primitive-types = { version = "=0.12.2", default-features = false, optional = true }
incrementalmerkletree = { version = "=0.9.0", default-features = false, optional = true }
sapling = { package = "sapling-crypto", version = "=0.9.0", default-features = false, optional = true }
orchard = { workspace = true, optional = true }
transparent = { package = "zcash_transparent", version = "=0.11.0-pre.0", default-features = false, optional = true }
groth16 = { version = "=0.2.0", default-features = false, optional = true }
bellman = { version = "=0.15.0", default-features = false, optional = true }
bls12_381 = { version = "=0.9.0", optional = true }
bellman-legacy = { package = "bellman", version = "=0.14.0", default-features = false, features = ["groth16"], optional = true }
bls12-381-legacy = { package = "bls12_381", version = "=0.8.0", optional = true }
group = { version = "=0.14.0", optional = true }
jubjub = { version = "=0.11.1", optional = true }
jubjub-legacy = { package = "jubjub", version = "=0.10.0", optional = true }
group-legacy = { package = "group", version = "=0.13.0", optional = true }
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa"], optional = true }
secp256k1 = { version = "=0.33.1", default-features = false, features = ["alloc"], optional = true }
redjubjub-legacy = { package = "redjubjub", version = "=0.8.0", default-features = false, optional = true }
ed25519-zebra = { version = "=5.0.0", optional = true }
zebra-chain = { version = "=14.0.0", default-features = false, optional = true }
ark-bn254 = { version = "=0.5.0", optional = true }
ark-ec = { version = "=0.5.0", optional = true }
ark-ff = { version = "=0.5.0", optional = true }

tempfile = { workspace = true, optional = true }
rusqlite = { version = "=0.40.2", features = ["bundled"], optional = true }

im = { version = "=15.1.0", optional = true }

[dev-dependencies]
redjubjub = { version = "=0.9.0", default-features = false }
hex.workspace = true
serde_json.workspace = true
tempfile.workspace = true
zebra-chain = { version = "=14.0.0", default-features = false }
zebra-test = "=4.0.0"
secp256k1 = { version = "=0.33.1", default-features = false, features = ["alloc"] }

[lints]
workspace = true
