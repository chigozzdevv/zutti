[package]
name = "zutti-spv-prototype"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace]

[dependencies]
zutti-source = { path = "../../crates/source", default-features = false, features = ["blocks"] }
zutti-protocol = { path = "../../crates/protocol", default-features = false }
zutti-wallet = { path = "../../crates/wallet", default-features = false, features = ["spv"] }
zcash_protocol = "=0.11.0-pre.0"
zcash_primitives = { version = "=0.31.0-pre.0", default-features = false }
zcash_encoding = "=0.5.0"
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std", "client"] }
risc0-build = { version = "=3.0.5", features = ["unstable"] }
risc0-binfmt = "=3.0.5"
clap = { version = "=4.6.1", features = ["derive"] }
sha2 = "=0.10.9"
serde_json = "=1.0.150"
hex = "=0.4.3"
bincode = "=1.3.3"

[dev-dependencies]
pczt = { version = "=0.10.0-pre.0", default-features = false, features = ["std", "io-finalizer", "zcp-builder", "signer"] }
orchard = { version = "=0.16.0", default-features = false }
rand = "=0.10.3"
incrementalmerkletree = "=0.9.0"

[[test]]
name = "spv"
path = "../../crates/source/tests/spv.rs"

[[test]]
name = "source-work"
path = "../../crates/source/tests/work.rs"

[[test]]
name = "payment-binding"
path = "../../crates/wallet/tests/binding.rs"

[[test]]
name = "wallet-preparation"
path = "../../crates/wallet/tests/preparation.rs"
