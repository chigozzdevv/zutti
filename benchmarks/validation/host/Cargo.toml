[package]
name = "zutti-validation-runner"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace]

[dependencies]
zutti-source = { path = "../../../crates/source", default-features = false, features = ["blocks"] }
zutti-protocol = { path = "../../../crates/protocol", default-features = false }
zcash_protocol = "=0.11.0-pre.0"
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std", "client"] }
risc0-build = { version = "=3.0.5", features = ["unstable"] }
risc0-binfmt = "=3.0.5"
clap = { version = "=4.6.1", features = ["derive"] }
sha2 = "=0.10.9"
serde_json = "=1.0.150"
hex = "=0.4.3"
