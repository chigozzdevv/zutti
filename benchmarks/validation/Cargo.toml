[package]
name = "zutti-validation-profile"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace]

[[bin]]
name = "zutti-tree-profile"
path = "src/trees.rs"

[[bin]]
name = "zutti-validation-batch"
path = "src/batch.rs"

[dependencies]
zutti-source = { path = "../../crates/source", default-features = false, features = ["blocks", "windowed-inputs", "accelerated-trees", "accelerated-scripts", "accelerated-sapling-signatures"] }
zutti-protocol = { path = "../../crates/protocol", default-features = false }
zcash_protocol = "=0.11.0-pre.0"
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std", "getrandom"] }
sha2 = "=0.10.9"

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1

[patch.crates-io]
dirs = { path = "../../crates/prover/methods/source/vendor/dirs" }
jubjub = { path = "../../crates/prover/methods/source/vendor/jubjub" }
halo2_proofs = { path = "../../crates/prover/methods/source/vendor/halo2_proofs" }
maybe-rayon = { path = "../../crates/prover/methods/source/vendor/maybe-rayon" }
bls12_381 = { git = "https://github.com/risc0/zkcrypto-bls12_381", rev = "a3192e1bc58921d42d03d99957abf3be55f9d435" }
k256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", rev = "7d4a8d6477e258ce4169ee4669cf92aee0582c39" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", rev = "3ab63a6f1048833f7047d5a50532e4a4cc789384" }

[lints.rust]
unsafe_code = "forbid"
