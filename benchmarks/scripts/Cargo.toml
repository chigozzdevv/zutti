[package]
name = "zutti-script-profile"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace]

[features]
accelerated-scripts = ["dep:k256"]

[dependencies]
zutti-protocol = { path = "../../crates/protocol", default-features = false }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
zcash_script = { version = "=0.6.0", default-features = false, features = ["signature-validation"] }
secp256k1 = { version = "=0.33.1", default-features = false, features = ["alloc"] }
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa"], optional = true }
sha2 = "=0.10.9"

[patch.crates-io]
k256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", rev = "7d4a8d6477e258ce4169ee4669cf92aee0582c39" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", rev = "3ab63a6f1048833f7047d5a50532e4a4cc789384" }

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
