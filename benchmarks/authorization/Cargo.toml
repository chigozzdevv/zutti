[package]
name = "zutti-authorization-profile"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace]

[features]
accelerated-proofs = ["dep:bellman-legacy", "dep:bls12-381-legacy"]
windowed-inputs = ["accelerated-proofs"]

[dependencies]
zutti-protocol = { path = "../../crates/protocol", default-features = false }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
bls12_381 = "=0.9.0"
groth16 = { version = "=0.2.0", default-features = false }
bellman-legacy = { package = "bellman", version = "=0.14.0", default-features = false, features = ["groth16"], optional = true }
bls12-381-legacy = { package = "bls12_381", version = "=0.8.0", optional = true }
sha2 = "=0.10.9"

[dev-dependencies]
hex = "=0.4.3"
serde_json = "=1.0.150"

[patch.crates-io]
bls12_381 = { git = "https://github.com/risc0/zkcrypto-bls12_381", rev = "a3192e1bc58921d42d03d99957abf3be55f9d435" }

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
