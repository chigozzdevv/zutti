[package]
name = "zutti-tree-profile"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace]

[features]
windowed-trees = []
accelerated-trees = ["windowed-trees", "dep:jubjub-legacy", "dep:group-legacy"]

[dependencies]
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
sapling = { package = "sapling-crypto", version = "=0.9.0", default-features = false }
jubjub = "=0.11.1"
group = "=0.14.0"
jubjub-legacy = { package = "jubjub", version = "=0.10.0", optional = true }
group-legacy = { package = "group", version = "=0.13.0", optional = true }

[patch.crates-io]
jubjub = { path = "../../crates/prover/methods/source/vendor/jubjub" }
bls12_381 = { git = "https://github.com/risc0/zkcrypto-bls12_381", rev = "a3192e1bc58921d42d03d99957abf3be55f9d435" }

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
