[package]
name = "zutti-tree-profile"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace]

[features]
windowed-trees = []

[dependencies]
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
sapling = { package = "sapling-crypto", version = "=0.9.0", default-features = false }
jubjub = "=0.11.1"
group = "=0.14.0"

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
