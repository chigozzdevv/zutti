[package]
name = "zutti-sapling-signature-profile"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace]

[features]
accelerated = ["dep:redjubjub-legacy"]

[dependencies]
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
redjubjub = { version = "=0.9.0", default-features = false }
redjubjub-legacy = { package = "redjubjub", version = "=0.8.0", default-features = false, optional = true }
sha2 = "=0.10.9"

[patch.crates-io]
jubjub = { path = "../../crates/prover/methods/source/vendor/jubjub" }
bls12_381 = { git = "https://github.com/risc0/zkcrypto-bls12_381", rev = "a3192e1bc58921d42d03d99957abf3be55f9d435" }

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
