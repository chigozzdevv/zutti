[workspace]
members = ["crates/protocol", "crates/wallet", "crates/source", "crates/prover", "crates/prover/methods", "crates/recovery"]
exclude = ["crates/prover/methods/guest", "crates/prover/methods/source", "crates/prover/methods/pool", "crates/prover/methods/binding", "crates/prover/methods/spv-pool", "crates/prover/methods/spv-source", "crates/wallet/ethereum", "crates/boundless"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace.dependencies]
zutti-protocol = { path = "crates/protocol", default-features = false }
zutti-wallet = { path = "crates/wallet" }
zutti-source = { path = "crates/source", default-features = false }
zutti-prover = { path = "crates/prover" }
sha2 = "=0.10.9"
zeroize = { version = "=1.9.0", features = ["derive"] }
getrandom = "=0.3.4"
thiserror = "=2.0.21"
hex = "=0.4.3"
serde_json = "=1.0.150"
chacha20poly1305 = "=0.10.1"
tempfile = "=3.27.0"
pczt = { version = "=0.10.0-pre.0", default-features = false, features = ["std", "io-finalizer", "zcp-builder"] }
zcash_primitives = { version = "=0.31.0-pre.0", default-features = false }
zcash_protocol = "=0.11.0-pre.0"
orchard = { version = "=0.16.0", default-features = false }
zcash_note_encryption = "=0.5.1"
zcash_encoding = "=0.5.0"
zcash_script = { version = "=0.6.0", default-features = false }
clap = { version = "=4.6.1", features = ["derive"] }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
risc0-build = { version = "=3.0.5", features = ["unstable"] }
risc0-binfmt = "=3.0.5"
bincode = "=1.3.3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "deny"
todo = "deny"

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1
